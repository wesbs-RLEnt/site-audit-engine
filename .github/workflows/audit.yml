name: Site audit (reusable)

on:
  workflow_call:
    inputs:
      config-path:
        description: Path to the site config in the calling repo
        type: string
        default: site-audit.config.yml
      engine-ref:
        description: Engine ref to use for check scripts
        type: string
        default: main
      run-checks:
        description: Set false to only validate the config (used by the engine self-test)
        type: boolean
        default: true
      use-claude:
        description: Write the report with Claude, then publish the issue and ledger (needs the secrets below)
        type: boolean
        default: false
    secrets:
      ANTHROPIC_API_KEY:
        required: false
      PROMPTS_DEPLOY_KEY:
        required: false
      SLACK_WEBHOOK_URL:
        required: false

# Least privilege: this job only reads. Later steps get their own narrow permissions.
permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout site repo (read-only)
        uses: actions/checkout@v4
        with:
          path: site
          persist-credentials: false

      - name: Checkout engine
        uses: actions/checkout@v4
        with:
          repository: wesbs-RLEnt/site-audit-engine
          ref: ${{ inputs.engine-ref }}
          path: engine
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install engine dependencies
        working-directory: engine
        run: npm ci

      - name: Validate config
        id: config
        run: node engine/scripts/validate-config.mjs "site/${{ inputs.config-path }}" >> "$GITHUB_OUTPUT"

      - name: Install browser
        if: inputs.run-checks
        working-directory: engine
        run: npx playwright install --with-deps chromium

      - name: Checkout previous ledger state
        if: inputs.run-checks
        continue-on-error: true # the branch does not exist on the first run
        uses: actions/checkout@v4
        with:
          ref: audit-ledger
          path: ledger
          persist-credentials: false

      - name: Run checks
        if: inputs.run-checks
        env:
          URL: ${{ steps.config.outputs.url }}
          SITEMAP: ${{ steps.config.outputs.sitemap }}
        run: |
          mkdir -p results
          # A failing check is recorded as missing, not fatal: the others still run.
          run() { node "engine/checks/$1.mjs" "$URL" "${@:2}" > "results/$1.json" || { echo "::warning::check $1 failed"; rm -f "results/$1.json"; }; }
          run raw-vs-rendered --sitemap "$SITEMAP"
          run site-files --sitemap "$SITEMAP"
          run links-and-alt --sitemap "$SITEMAP"
          run lighthouse --sitemap "$SITEMAP"
          node engine/checks/deps.mjs site > results/deps.json || { echo "::warning::check deps failed"; rm -f results/deps.json; }

      - name: Condense findings
        if: inputs.run-checks
        run: |
          prev=""
          [ -f ledger/state.json ] && prev="--previous ledger/state.json"
          node engine/scripts/condense.mjs --results results --config "site/${{ inputs.config-path }}" $prev --out findings.json --state state.json

      - name: Stage config and previous ledger for later jobs
        if: inputs.run-checks
        run: |
          cp "site/${{ inputs.config-path }}" config.yml
          [ -f ledger/agent-ledger.md ] && cp ledger/agent-ledger.md previous-ledger.md || true

      - name: Upload results
        if: inputs.run-checks
        uses: actions/upload-artifact@v4
        with:
          name: audit-results
          path: |
            findings.json
            state.json
            config.yml
            previous-ledger.md
            results/
          retention-days: 14

  # Holds the Anthropic key and the prompts deploy key. Read-only: it cannot write to any repo.
  report:
    needs: audit
    if: inputs.run-checks && inputs.use-claude
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: audit-results

      - name: Checkout engine
        uses: actions/checkout@v4
        with:
          repository: wesbs-RLEnt/site-audit-engine
          ref: ${{ inputs.engine-ref }}
          path: engine
          persist-credentials: false

      - name: Checkout private prompts
        uses: actions/checkout@v4
        with:
          repository: wesbs-RLEnt/site-audit-prompts
          ssh-key: ${{ secrets.PROMPTS_DEPLOY_KEY }}
          path: prompts
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install engine dependencies
        working-directory: engine
        run: npm ci

      - name: Write report (Claude, no tools)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          USAGE_FILE: usage.json
        run: node engine/scripts/generate-report.mjs prompts/prompts/report.md config.yml findings.json previous-ledger.md > report.md

      - name: Upload draft report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: |
            report.md
            usage.json
          retention-days: 14

      - name: Check report
        run: node engine/scripts/check-report.mjs report.md findings.json config.yml

  # Holds write access (issues, and the ledger branch) and no Claude or API key.
  publish:
    needs: report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: audit-results

      - uses: actions/download-artifact@v4
        with:
          name: audit-report

      - name: Checkout engine
        uses: actions/checkout@v4
        with:
          repository: wesbs-RLEnt/site-audit-engine
          ref: ${{ inputs.engine-ref }}
          path: engine
          persist-credentials: false

      - name: Create issue
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          site=$(node -p "require('./findings.json').site")
          date=$(node -p "require('./findings.json').date")
          url=$(gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Site audit: $site - $date" \
            --body-file report.md)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Append ledger entry (audit-ledger branch only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global user.name "site-audit-bot"
          git config --global user.email "site-audit-bot@users.noreply.github.com"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ledger
          cd ledger
          if git ls-remote --exit-code --heads origin audit-ledger >/dev/null; then
            git checkout audit-ledger
          else
            git checkout --orphan audit-ledger
            git rm -rf . -q
            printf '# Agent ledger\n\n' > agent-ledger.md
          fi
          node ../engine/scripts/ledger-entry.mjs ../findings.json ../results ../report.md ../usage.json >> agent-ledger.md
          cp ../state.json state.json
          git add agent-ledger.md state.json
          git commit -m "Ledger: audit $(node -p "require('../findings.json').date")"
          git push origin audit-ledger

      - name: Notify Slack
        if: env.SLACK_WEBHOOK_URL != ''
        continue-on-error: true # a Slack outage must not fail the audit
        env:
          ISSUE_URL: ${{ steps.issue.outputs.url }}
        run: |
          node engine/scripts/slack-message.mjs findings.json "$ISSUE_URL" > slack.json
          curl --fail --silent --show-error -X POST -H 'Content-type: application/json' --data @slack.json "$SLACK_WEBHOOK_URL"
