name: Site audit (reusable)

on:
  workflow_call:
    inputs:
      config-path:
        description: Path to the site config in the calling repo
        type: string
        default: site-audit.config.yml

# Least privilege: this step only reads. Later steps get their own narrow permissions.
permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout site repo (read-only)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate config
        env:
          CONFIG_PATH: ${{ inputs.config-path }}
        run: |
          pip install --quiet pyyaml
          python3 - <<'PY'
          import os, sys, yaml
          path = os.environ["CONFIG_PATH"]
          if not os.path.isfile(path):
              sys.exit(f"::error::No config found at {path}")
          c = yaml.safe_load(open(path)) or {}
          errors = []
          site = c.get("site") or {}
          for k in ("name", "url", "stack"):
              if not site.get(k):
                  errors.append(f"site.{k} is required")
          if site.get("url") and not str(site["url"]).startswith("https://"):
              errors.append("site.url must start with https://")
          if site.get("stack") not in ("lovable-vite", "react-ssr", "wordpress", "other"):
              errors.append("site.stack must be lovable-vite | react-ssr | wordpress | other")
          if c.get("autonomy", "report") != "report":
              errors.append("autonomy must be 'report' in the MVP")
          for k in ("allowed_paths", "forbidden_paths"):
              if not isinstance((c.get("scope") or {}).get(k), list):
                  errors.append(f"scope.{k} must be a list")
          if errors:
              for e in errors:
                  print(f"::error::{e}")
              sys.exit(1)
          print("Config valid")
          PY

      - name: Echo config
        env:
          CONFIG_PATH: ${{ inputs.config-path }}
        run: |
          echo "Repo: $GITHUB_REPOSITORY"
          if [ -f "$CONFIG_PATH" ]; then
            echo "--- $CONFIG_PATH ---"
            cat "$CONFIG_PATH"
          else
            echo "::error::No config found at $CONFIG_PATH"
            exit 1
          fi
